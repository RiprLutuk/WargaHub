name: wargahub

x-api-common: &api-common
  image: wargahub-api:${WARGAHUB_VERSION:-local}
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  restart: unless-stopped
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    DATABASE_URL: postgresql://${POSTGRES_USER:-wargahub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wargahub}
    WEB_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
    UPLOAD_DIR: /app/uploads
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: "${SMTP_FROM:-WargaHub <noreply@example.org>}"
    LOG_LEVEL: ${LOG_LEVEL:-info}
  volumes:
    - uploads:/app/uploads
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wargahub}
      POSTGRES_USER: ${POSTGRES_USER:-wargahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    <<: *api-common
    command:
      - sh
      - -c
      - bun apps/api/dist/db/migrate.js && exec bun apps/api/dist/server.js
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3000/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *api-common
    command: ["bun", "apps/api/dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - Bun.file('/proc/1/cmdline').text().then((value)=>{if(!value.includes('worker.js'))process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: wargahub-web:${WARGAHUB_VERSION:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=8m,mode=0700,uid=1000,gid=1000
      - /data:size=8m,mode=0700,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    user: "1000:1000"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
